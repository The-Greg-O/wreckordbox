name: Feature request
description: Propose an improvement to wreckordbox
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the idea here, or open a pull request directly if you already have the change. Note that wreckordbox is a personal fork guided by the architecture decisions in `docs/adr/`; feature ideas outside that scope may be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the DJ or agent workflow behind the request.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what successful behavior would look like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include hardware, rekordbox version, or related ADRs/docs when relevant.
