name: Bug report
description: Report a reproducible problem in wreckordbox
title: ""
labels:
  - bug
  - user-report
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md instead of this public form. Thanks for reporting this. Do not include private library files, personal paths, track/playlist names, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wreckordbox commit or version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Relevant DJ hardware and firmware
      description: Include exact model and firmware version when this involves a player.
  - type: textarea
    id: evidence
    attributes:
      label: Logs and other evidence
      description: Attach a redacted log excerpt. Remove personal filesystem paths, track/playlist/tag names, and credentials.
