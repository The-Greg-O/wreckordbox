name: Nix smoke test
description: >-
  Build the source Nix package and require it to open a window under Xvfb.

inputs:
  package:
    description: "Package to smoke-test: source"
    required: false
    default: "source"

runs:
  using: composite
  steps:
    - name: Install X11 and GL libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils \
          libegl1 libegl-mesa0 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri \
          libgbm1 libdrm2 libfribidi0
        sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

    - name: Build the package
      id: build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        case "$PACKAGE" in
          source)
            out="$(nix build --no-link --print-out-paths .#source)"
            ;;
          *)
            echo "::error::unknown package: $PACKAGE"
            exit 1
            ;;
        esac
        echo "out=$out" >> "$GITHUB_OUTPUT"

    - name: Require a native Linux window
      shell: bash
      run: |
        set -euo pipefail
        export RBXPORT_TEST=1
        export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
        export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
        export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
        export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
        mkdir -p "$XDG_RUNTIME_DIR"
        chmod 700 "$XDG_RUNTIME_DIR"

        package="${{ steps.build.outputs.out }}"
        executable="$package/bin/wreckordbox-desktop"
        export LIBGL_ALWAYS_SOFTWARE=1
        export WEBKIT_DISABLE_DMABUF_RENDERER=1

        log="$RUNNER_TEMP/wreckordbox-nix-window.log"
        # shellcheck disable=SC2016 # $1/$2 expand in the child shell below.
        xvfb-run -a bash -c '
          set -euo pipefail
          "$1" >"$2" 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
          for _ in $(seq 1 120); do
            if xwininfo -root -tree | grep -Fq "wreckordbox"; then exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$2"
          echo "::error::wreckordbox did not create a Linux window"
          exit 1
        ' _ "$executable" "$log"
