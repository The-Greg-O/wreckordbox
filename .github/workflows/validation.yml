name: Shared validation

# Coordinates independently selectable validation lanes. Pull requests pass a
# path-derived plan; pushes and manual runs validate every supported lane.
on:
  workflow_call:
    inputs:
      source_ref:
        description: "Immutable commit SHA or ref to validate"
        required: true
        type: string
      base_ref:
        description: "PR base SHA used to narrow affected tests"
        required: false
        default: ""
        type: string
      full:
        description: "Run full validation instead of focused PR checks"
        required: false
        default: true
        type: boolean
      skip_tests:
        required: false
        default: false
        type: boolean
      validate_rust:
        required: false
        default: true
        type: boolean
      validate_linux:
        required: false
        default: true
        type: boolean
      validate_scripts:
        required: false
        default: true
        type: boolean
      validate_frontend_lint:
        required: false
        default: true
        type: boolean
      validate_frontend_typecheck:
        required: false
        default: true
        type: boolean
      validate_frontend_build:
        required: false
        default: true
        type: boolean
      validate_frontend_unit:
        required: false
        default: true
        type: boolean
      validate_frontend_e2e:
        required: false
        default: true
        type: boolean
      validate_frontend_budget:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    if: ${{ !inputs.skip_tests && inputs.validate_rust }}
    uses: ./.github/workflows/validate-rust.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      base_ref: ${{ inputs.base_ref }}
      full: ${{ inputs.full }}

  linux-window:
    name: Linux window
    needs: rust
    if: >-
      always() && !inputs.skip_tests && inputs.validate_linux &&
      (!inputs.validate_rust || needs.rust.result == 'success')
    uses: ./.github/workflows/validate-linux.yml
    with:
      source_ref: ${{ inputs.source_ref }}

  scripts:
    name: Node scripts
    if: ${{ !inputs.skip_tests && inputs.validate_scripts }}
    uses: ./.github/workflows/validate-scripts.yml
    with:
      source_ref: ${{ inputs.source_ref }}

  frontend:
    name: Frontend
    if: >-
      !inputs.skip_tests && (inputs.validate_frontend_lint ||
      inputs.validate_frontend_typecheck || inputs.validate_frontend_build ||
      inputs.validate_frontend_unit ||
      inputs.validate_frontend_e2e || inputs.validate_frontend_budget)
    uses: ./.github/workflows/validate-frontend.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      base_ref: ${{ inputs.base_ref }}
      full: ${{ inputs.full }}
      run_lint: ${{ inputs.validate_frontend_lint }}
      run_typecheck: ${{ inputs.validate_frontend_typecheck }}
      run_build: ${{ inputs.validate_frontend_build }}
      run_unit: ${{ inputs.validate_frontend_unit }}
      run_e2e: ${{ inputs.validate_frontend_e2e }}
      run_budget: ${{ inputs.validate_frontend_budget }}

  validated:
    name: Validation complete
    needs: [rust, linux-window, scripts, frontend]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful selected lanes
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          const failed = Object.entries(results).filter(([, job]) =>
            !["success", "skipped"].includes(job.result));
          if (failed.length) {
            console.error("Validation failed:", failed.map(([name, job]) => `${name}: ${job.result}`).join(", "));
            process.exit(1);
          }
          console.log("All selected validation lanes passed.");
          JS
