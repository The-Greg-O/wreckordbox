name: Validate Linux window

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RBXPORT_TEST: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  linux-window:
    name: Linux Tauri window smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev xvfb xauth x11-utils

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.99.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
          shared-key: clippy-linux

      - name: Build the Linux shell without bundling
        run: pnpm tauri build --debug --no-bundle --ci

      - name: Require a native Linux window
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          log="$RUNNER_TEMP/rbxport-linux-window.log"
          # shellcheck disable=SC2016 # $1/$2 expand in the child shell below.
          xvfb-run -a bash -c '
            set -euo pipefail
            "$1" >"$2" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 20); do
              if xwininfo -root -tree | grep -Fq "wreckordbox"; then exit 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "$2"
            echo "::error::wreckordbox did not create a Linux window"
            exit 1
          ' _ target/debug/wreckordbox-desktop "$log"
