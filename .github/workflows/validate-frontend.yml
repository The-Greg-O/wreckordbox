name: Validate frontend

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      base_ref:
        required: false
        default: ""
        type: string
      full:
        required: false
        default: true
        type: boolean
      run_lint:
        required: false
        default: false
        type: boolean
      run_typecheck:
        required: false
        default: false
        type: boolean
      run_build:
        required: false
        default: false
        type: boolean
      run_unit:
        required: false
        default: false
        type: boolean
      run_e2e:
        required: false
        default: false
        type: boolean
      run_budget:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ] || [ -z "$BASE_REF" ]; then
            pnpm lint
            exit 0
          fi

          changed="$RUNNER_TEMP/frontend-lint-paths"
          git diff --name-only --diff-filter=ACMR "$BASE_REF...HEAD" > "$changed"
          if grep -Eq '^(package\.json|pnpm-lock\.yaml|eslint\.config\.|tsconfig)' "$changed"; then
            pnpm lint
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(grep -E '^(src|e2e)/.*\.[cm]?[jt]sx?$' "$changed" || true)
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec eslint "${files[@]}" --max-warnings 0
          fi

      - name: Typecheck
        if: inputs.run_typecheck
        run: pnpm typecheck

      - name: Production build
        if: inputs.run_build || inputs.run_e2e || inputs.run_budget
        run: pnpm exec vite build

      - name: Bundle budget
        if: inputs.run_budget
        run: pnpm budget

      - name: Install Playwright browsers
        if: inputs.run_e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        if: inputs.run_e2e
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FULL: ${{ inputs.full }}
        run: |
          port="$((20000 + GITHUB_RUN_NUMBER % 10000))"
          if [ "$FULL" = true ] || [ -z "$BASE_REF" ]; then
            E2E_PORT="$port" pnpm e2e --project chromium --workers=1 --trace off
            exit 0
          fi

          changed="$RUNNER_TEMP/frontend-changed-paths"
          git diff --name-only "$BASE_REF...HEAD" > "$changed"
          if grep -Fxq playwright.config.ts "$changed" || \
            grep '^e2e/' "$changed" | grep -vqE '\.spec\.[cm]?[jt]s$'; then
            E2E_PORT="$port" pnpm e2e --project chromium --workers=1 --trace off
          else
            pnpm build:mock
            E2E_PREVIEW_DIR=dist-mock E2E_PORT="$port" pnpm exec playwright test \
              --only-changed "$BASE_REF" --pass-with-no-tests --project chromium --workers=1 --trace off
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && inputs.run_e2e
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  unit:
    name: Frontend unit tests
    if: inputs.run_unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ] || [ -z "$BASE_REF" ]; then
            pnpm test --maxWorkers=2
          else
            pnpm exec vitest run --changed "$BASE_REF" --passWithNoTests --maxWorkers=2
          fi
