[package]
name = "wreckordbox-stick-outline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A mounted Stick's playlist trees, read without writing anything to the Stick."

[lints]
workspace = true

[features]
# Temporary-folder Sticks for this crate's tests and the app's.
testing = ["dep:rbl-anlz"]

[dependencies]
rbl-anlz = { path = "../rbl-anlz", optional = true }
tempfile = "3"
rbl-core = { path = "../rbl-core" }
rbl-export = { path = "../rbl-export" }
rbl-onelibrary = { path = "../rbl-onelibrary" }
rbl-pdb = { path = "../rbl-pdb" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wreckordbox-stick-outline = { path = ".", features = ["testing"] }
tempfile = "3"
serde_json = { workspace = true }
rbl-anlz = { path = "../rbl-anlz" }
