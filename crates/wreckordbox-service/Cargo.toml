[package]
name = "wreckordbox-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Library service: the one owner of the Library, and the client its front ends use."

[lints]
workspace = true

[dependencies]
rbl-db = { path = "../rbl-db" }
# The index and search the window uses, so a query here matches the window.
rbl-index = { path = "../rbl-index" }
# The Library core: the loaded index and the single path every edit takes,
# shared with the window so the two cannot drift.
rbl-library = { path = "../rbl-library" }
# Only for where the window keeps its recovery journals.
rbl-backup = { path = "../rbl-backup" }
# The Sidecar: the store of Facts beside the Library, which the service owns
# as it owns the Library.
wreckordbox-sidecar = { path = "../wreckordbox-sidecar" }
# Intensity: the measurement itself, and the beat grid it is aligned to.
wreckordbox-intensity = { path = "../wreckordbox-intensity" }
rbl-anlz = { path = "../rbl-anlz" }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
# Only to tell a locked Library from a damaged one by SQLite's result code.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
