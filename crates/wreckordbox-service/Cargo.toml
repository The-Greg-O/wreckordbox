[package]
name = "wreckordbox-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Library service: the one owner of the Library, and the client its front ends use."

[lints]
workspace = true

[dependencies]
rbl-db = { path = "../rbl-db" }
# The index and search the window uses, so a query here matches the window.
rbl-index = { path = "../rbl-index" }
# The Library core: the loaded index and the single path every edit takes,
# shared with the window so the two cannot drift.
rbl-library = { path = "../rbl-library" }
# Only for where the window keeps its recovery journals.
rbl-backup = { path = "../rbl-backup" }
# The Sidecar: the store of Facts beside the Library, which the service owns
# as it owns the Library.
wreckordbox-sidecar = { path = "../wreckordbox-sidecar" }
# Intensity: the measurement itself, and the beat grid it is aligned to.
wreckordbox-intensity = { path = "../wreckordbox-intensity" }
rbl-anlz = { path = "../rbl-anlz" }
# Native stems: the writer of a track's Stems to a Stick, which the service
# drives because it owns the Sidecar the Stems are in.
wreckordbox-native-stems = { path = "../wreckordbox-native-stems" }
wreckordbox-stick-protection = { path = "../wreckordbox-stick-protection" }
# Loading a Stick (wbx-70): the window's planner, export selection and
# confirmation, shared; the export itself, unchanged (ADR 0003); the
# volumes the window offers; the Stick read without recovering it.
wreckordbox-stick-write = { path = "../wreckordbox-stick-write" }
wreckordbox-stick-outline = { path = "../wreckordbox-stick-outline" }
rbl-export = { path = "../rbl-export" }
rbl-devices = { path = "../rbl-devices" }
rbl-core = { path = "../rbl-core" }
# The Library core's gates, as the shared planner takes them.
parking_lot = "0.12"
# The renderer's Stem set type: the service hands it only verified-current
# Stems (`render_stems`). Without Rubber Band here; a binary that renders
# key or tempo edits turns the feature on.
wreckordbox-render = { path = "../wreckordbox-render", default-features = false }
serde = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
# The DJ's projection policy file (`projection-policy.toml`).
toml = "0.8"
# Only to tell a locked Library from a damaged one by SQLite's result code.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
