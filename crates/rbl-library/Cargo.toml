[package]
name = "rbl-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Library core: the loaded index, its open views, and the single path every Library edit takes."

[lints]
workspace = true

[dependencies]
rbl-db = { path = "../rbl-db" }
rbl-index = { path = "../rbl-index" }
rbl-backup = { path = "../rbl-backup" }
rbl-core = { path = "../rbl-core" }
# The same build of SQLite the writer links; `entry_order` writes through its connection.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
