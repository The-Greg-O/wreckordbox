[package]
name = "wreckordbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The headless wreckordbox command: a thin client of the Library service."

[lints]
workspace = true

[dependencies]
wreckordbox-service = { path = "../wreckordbox-service" }
wreckordbox-stick-protection = { path = "../wreckordbox-stick-protection" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# `stick load` tests: the Stick read back without recovering it.
wreckordbox-stick-outline = { path = "../wreckordbox-stick-outline", features = ["testing"] }
# Compare service readiness with the capabilities of this exact build.
wreckordbox-render = { path = "../wreckordbox-render", default-features = false }
# `backup` tests: archives laid out as a backup is, and a restore stopped
# between two replacements.
rbl-backup = { path = "../rbl-backup", features = ["testing"] }
rbl-db = { path = "../rbl-db" }
# Only to give a test track a beat grid.
rbl-anlz = { path = "../rbl-anlz" }
# `stems write` tests: a fixture Sidecar holding synthetic Stems, a
# temporary folder exported to as a Stick, and the independent reader of
# Native stems (its Vorbis decoder).
wreckordbox-sidecar = { path = "../wreckordbox-sidecar" }
rbl-export = { path = "../rbl-export" }
rbl-onelibrary = { path = "../rbl-onelibrary" }
lewton = "0.10"
# The same build of SQLite the service uses, to reach into a test's Sidecar.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = { workspace = true }
tempfile = "3"

# Real tag round trips beside the prepared key-tag writer.
lofty = { version = "0.22", default-features = false }
