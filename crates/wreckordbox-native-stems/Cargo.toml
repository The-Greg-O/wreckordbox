[package]
name = "wreckordbox-native-stems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native stems: a track's Stems written to a Stick in the layout a modded XDJ-AZ plays."

[lints]
workspace = true

[dependencies]
# Only its readers of a Stick's exported library: the path the library holds
# for a track is where a Native stems folder gets its name.
rbl-export = { path = "../rbl-export" }
# The Stick's library read without ever settling an unfinished export
# (wbx-45.5's reader; wbx-45.11).
wreckordbox-stick-outline = { path = "../wreckordbox-stick-outline" }
thiserror = { workspace = true }
# Only to read the `source.json` of a folder already on the Stick.
serde_json = { workspace = true }
# Reads the Sidecar's Stem audio (WAV today), and how long a parent track
# is by its container, whatever its format. The build the other crates use.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "aiff", "pcm", "adpcm"] }
# libvorbis (the aoTuV tuning) built from vendored source, BSD-3-Clause: the
# deck reads Ogg Vorbis and nothing else.
vorbis_rs = "0.5"
# The CRC-32 of the layout's `-XXXXXXXX` folder suffix. Already in the lock.
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
# The independent reader's Vorbis decoder: pure Rust, nothing of libvorbis.
lewton = "0.10"
serde_json = { workspace = true }
# Only so a test Stick can name the Library it was exported from.
rbl-onelibrary = { path = "../rbl-onelibrary" }
