@container (max-width:800px){

 .meta{width:170px}.dims{grid-template-columns:repeat(2,1fr)}.big .dt{height:64px}.form{gap:8px;padding:8px 12px}.row{padding-left:8px}.pad{width:44px}.pad span{display:none}.fb .f:nth-child(n+5){display:none}
}

function draw(){document.querySelectorAll("canvas").forEach(c=>{
  const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;c.width=w*2;c.height=h*2;const g=c.getContext("2d");g.scale(2,2);
  let s=+c.dataset.seed*9301+49297;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const kind=c.dataset.kind;
  if(kind=="curve"){const en=[2,2,2,2,3,3,3,4,4,4,5,5,3,2],n=en.length,x=i=>30+i*(w-60)/(n-1),y=v=>h-18-(v/5.4)*(h-34);
    g.strokeStyle="#24283b";g.lineWidth=1;[1,2,3,4,5].forEach(v=>{g.beginPath();g.moveTo(30,y(v));g.lineTo(w-30,y(v));g.stroke();g.fillStyle="#565f89";g.font="10px monospace";g.fillText(v,12,y(v)+3);});
    g.setLineDash([5,5]);g.strokeStyle="#565f89";g.lineWidth=1.5;g.beginPath();for(let i=0;i<=100;i++){const p=i/100,v=1.6+3.4*Math.pow(Math.sin(Math.min(p/.82,1)*Math.PI/2),1.4)-(p>.82?(p-.82)/.18*3:0);i?g.lineTo(30+p*(w-60),y(v)):g.moveTo(30+p*(w-60),y(v));}g.stroke();g.setLineDash([]);
    const iv=en.map((e,i)=>e+[-.3,.1,.2,.3,-.1,.3,.2,-.2,.1,.2,-.1,.1,.4,.2][i]);
    g.beginPath();iv.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.lineTo(x(n-1),h);g.lineTo(x(0),h);g.fillStyle="rgba(255,158,100,.12)";g.fill();
    g.beginPath();iv.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.strokeStyle="#ff9e64";g.lineWidth=2;g.stroke();
    iv.forEach((v,i)=>{g.fillStyle=i==4?"#c0caf5":"#ff9e64";g.beginPath();g.arc(x(i),y(v),i==4?5:3,0,7);g.fill();});
    g.fillStyle="#565f89";g.fillText("Intensity across the set  ·  dashed: what the recipe asks for",30,12);return;}
  const W=c.width,H=c.height,det=kind=="detail",hy=kind=="hype",th=c.dataset.theme||"3band";
  const N=k=>{const a=[];let q=(+c.dataset.seed+k)*9301+49297;for(let i=0;i<512;i++){q=(q*9301+49297)%233280;a.push(q/233280);}return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return a[i%512]*(1-u)+a[(i+1)%512]*u;};};
  const n1=N(1),n2=N(2),n3=N(3),lvl=t=>t<.1?.35:t<.22?.6:t<.42?1:t<.52?.3:t<.6?.65:t<.82?1:.42;
  const PAL={"3band":["#0055E1","#FFA600","#FFFFFF"],theme:["#7aa2f7","#bb9af7","#c0caf5"],blue:["#1f4fbf","#4d8dff","#cfe0ff"]}[th];
  g.setTransform(1,0,0,1,0,0);
  if(det){for(let i=0;i<=16;i++){g.fillStyle=i%4?"#24283b":"#565f89";g.fillRect(Math.round(i*W/16),0,i%4?1:2,H);}}
  const mid=(det||hy)?H/2:H;
  for(let x=0;x<W;x++){const t=x/W;let lo,mi,hi;
    if(det||hy){const bp=(t*16)%1,k=Math.exp(-bp*5);lo=.2+.75*k*(.85+.15*n1(t*60));mi=.22+.3*n2(t*140)+.25*Math.exp(-((t*16+.5)%1)*6);hi=.08+.3*Math.exp(-((t*32)%1)*9)+.12*n3(t*420);if(hy){const e=.5+.5*n1(t*9);lo*=e;mi*=e;hi*=e;}}
    else{const e=lvl(t);lo=e*(.68+.32*n1(t*300));mi=lo*(.45+.35*n2(t*220));hi=mi*(.35+.45*n3(t*400));}
    const done=!hy||t<.58,dr=(v,col)=>{g.fillStyle=col;const hh=Math.max(1,v*mid*.94);(det||hy)?g.fillRect(x,mid-hh,1,hh*2):g.fillRect(x,H-hh,1,hh);};
    if(!done){dr(Math.max(lo,mi),"#24283b");continue;}
    if(th=="rgb"){const m=Math.max(lo,mi,hi);dr(m,`rgb(${Math.round(60+195*lo/m)},${Math.round(40+215*mi/m)},${Math.round(255*Math.min(1,hi/m*1.8))})`);}
    else if(hy){dr(lo,"#bb9af7");dr(mi*.8,"#ff9e64");dr(hi*.7,"#c0caf5");}
    else{dr(lo,PAL[0]);dr(Math.min(mi,lo*.98)*.8,PAL[1]);dr(hi*.55,PAL[2]);}
  }
  if(hy){g.fillStyle="#f7768e";g.fillRect(.58*W,0,5,H);return;}
  if(c.dataset.plain)return;
  (det?[.1875,.625]:[.02,.09,.19,.47]).forEach((p,i)=>{g.fillStyle=["#3CEB50","#0db9d7","#bb9af7","#e0af68"][det?i+1:i];g.fillRect(p*W,0,det?4:3,H);g.fillRect(p*W,0,14,10);});
  g.shadowColor="#ff3b3b";g.shadowBlur=12;g.fillStyle="#ff4d4d";g.fillRect((det?.5:.29)*W,0,3,H);g.shadowBlur=0;
});}
